# NIST SP 800-53 Rev. 5 (release 5.2.0), the host subset. Public catalog;
# controls cited by id, our wording for the title.

framework: "NIST SP 800-53"
version: "Rev. 5 (5.2.0)"

controls:
  - control_id: "nist.ac-7"
    title: "Failed logon attempts are limited"
    kind: automated
    checks:
      - accounts.lockout
    references:
      - id: "AC-7"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.ac-3"
    title: "Access to the system is enforced"
    kind: automated
    checks:
      - accounts.empty_passwords
      - accounts.uid0
    references:
      - id: "AC-3"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.au-6"
    title: "Audit records are reviewed"
    kind: attestation
    references:
      - id: "AU-6"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.cm-6"
    title: "The system is configured to the baseline"
    kind: automated
    checks:
      - hardening.state
      - sysctl.hardening
    references:
      - id: "CM-6"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.cm-7"
    title: "Only essential functions and ports run"
    kind: automated
    checks:
      - ports.exposed_services
      - usb.guard
    references:
      - id: "CM-7"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.sc-7"
    title: "The boundary is protected"
    kind: automated
    checks:
      - posture.firewall
    references:
      - id: "SC-7"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.sc-13"
    title: "Cryptography protects the data"
    kind: automated
    checks:
      - posture.disk_encryption
    references:
      - id: "SC-13"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.sc-28"
    title: "Data at rest is protected"
    kind: automated
    checks:
      - posture.disk_encryption
      - posture.swap_encryption
    references:
      - id: "SC-28"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.si-2"
    title: "Flaws are remediated promptly"
    kind: automated
    checks:
      - cves.security_updates
      - posture.updates_pending
    references:
      - id: "SI-2"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.si-3"
    title: "Malicious code is detected and blocked"
    kind: automated
    checks:
      - av.signatures
      - av.scanner
    references:
      - id: "SI-3"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"

  - control_id: "nist.si-4"
    title: "The system is monitored for attack"
    kind: attestation
    references:
      - id: "SI-4"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
        date: "2026-11-06"
