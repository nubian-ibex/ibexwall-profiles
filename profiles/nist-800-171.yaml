# NIST SP 800-171 Rev. 3, the host subset (CUI protection). Public; cited
# by requirement id, our wording for the title.

framework: "NIST SP 800-171"
version: "Rev. 3"

controls:
  - control_id: "nist171.ac"
    title: "Access to the system is limited and authenticated"
    kind: automated
    checks:
      - accounts.empty_passwords
      - accounts.uid0
      - accounts.lockout
    references:
      - id: "3.1 Access Control"
        url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
        date: "2026-11-06"

  - control_id: "nist171.config"
    title: "The system is configured to the baseline"
    kind: automated
    checks:
      - hardening.state
      - sysctl.hardening
    references:
      - id: "3.4 Configuration Management"
        url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
        date: "2026-11-06"

  - control_id: "nist171.system-protection"
    title: "The system and its communications are protected"
    kind: automated
    checks:
      - posture.firewall
      - dns.secure_resolver
      - posture.disk_encryption
    references:
      - id: "3.13 System and Communications Protection"
        url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
        date: "2026-11-06"

  - control_id: "nist171.system-integrity"
    title: "The system is protected from flaws and malware"
    kind: automated
    checks:
      - cves.security_updates
      - av.signatures
      - av.scanner
    references:
      - id: "3.14 System and Information Integrity"
        url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
        date: "2026-11-06"

  - control_id: "nist171.audit"
    title: "Audit records are kept and reviewed"
    kind: attestation
    references:
      - id: "3.3 Audit and Accountability"
        url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
        date: "2026-11-06"
